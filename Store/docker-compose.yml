volumes:
  store-data:

services:
  postgres:
    image: postgres:17
    container_name: store-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store-db
    ports:
      - "5434:5432"
    volumes:
      - store-data:/var/lib/postgresql/data
    restart: unless-stopped